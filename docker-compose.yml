version: '3.9'

services:
  caddy:
    image: caddy:2.7-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_AGREE: "true"
    networks:
      - app-network
    depends_on:
      - n8n
      - hermes

  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.annamiyarkai.com}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_TUNNEL_URL=${WEBHOOK_TUNNEL_URL:-https://n8n.annamiyarkai.com}
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/home/node/data/database.sqlite
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8.0-alpine
    restart: always
    container_name: omniroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 30 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: always
    container_name: omniroute
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    environment:
      - PORT=20128
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:20128/api/settings').then(r=>{if(!r.ok)throw 0})\""]
      interval: 30s
      timeout: 10s
      retries: 3


  hermes:
    image: nousresearch/hermes-agent:latest
    restart: always
    ports:
      - "8765:8765"
    environment:
      - HERMES_LLM_PROVIDER=ollama
      - HERMES_LLM_MODEL=llama2:7b-chat
      - HERMES_DATA_DIR=/root/.hermes
      - OLLAMA_BASE_URL=http://ollama:11434
      - HERMES_LOG_LEVEL=debug
    volumes:
      - hermes_data:/root/.hermes
    networks:
      - app-network
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    environment:
      OLLAMA_KEEP_ALIVE: 24h

volumes:
  n8n_data:
    driver: local
  hermes_data:
    driver: local
  ollama_data:
    driver: local
  caddy_data:
    driver: local
  omniroute_data:
    driver: local
  redis_data:
    driver: local
  caddy_config:
    driver: local

networks:
  app-network:
    driver: bridge
